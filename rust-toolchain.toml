# Pinned so clippy and rustfmt give the same answers locally and in CI. Each
# stable release adds lints, which would otherwise fail CI with no code change.
# Bump it on purpose, and fix the new warnings in the same change.
# llvm-tools is for cargo-llvm-cov (`npm run test:coverage`).
[toolchain]
channel = "1.99.0"
components = ["clippy", "llvm-tools", "rustfmt"]
