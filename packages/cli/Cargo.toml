[package]
name = "omni-build"
description = "Build, sign, install and ship iOS and Android apps with no native toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cms = "0.2.3"
const-oid = { version = "0.9.6", features = ["db"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
# PNG only: app icons are PNGs, and resizing them is all OmniBuild does.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# actool compresses an asset catalog's bitmaps with LZFSE. Pure Rust, unlike
# the bindings to Apple's C library, so every release target builds without
# a C toolchain. OmniBuild only compresses its own pixels with it, and never
# decompresses what users hand it.
lzfse_rust = "0.2.1"
# Without serde: Info.plist is edited as a dictionary, so the keys OmniBuild
# doesn't know stay as Xcode wrote them.
plist = { version = "1.10.1", default-features = false }
# rsa, x509-cert, cms and const-oid are RustCrypto crates of one generation,
# which share der, spki and pkcs8. rsa 0.10 is still a release candidate.
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Apple's code signatures still use SHA-1 in two places: the resource seal
# for older iOS versions, and a non-Apple certificate in a requirement.
sha1 = "0.10.7"
sha2 = "0.10.9"
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
