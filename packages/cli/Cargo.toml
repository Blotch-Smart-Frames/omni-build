[package]
name = "omni-build"
description = "Build, sign, install and ship iOS and Android apps with no native toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://blotch-smart-frames.github.io/omni-build/"
readme = "README.md"
keywords = ["android", "ios", "apk", "codesign", "mobile"]
categories = ["command-line-utilities", "development-tools::build-utils"]
# What crates.io gets: the code, with the files it embeds (Apple's
# certificates), and what it has to come with. Not the package.json, turbo
# and cspell settings that only the monorepo reads, nor the tests, whose
# fixtures `cargo install` doesn't need. LICENSE links to the repository's,
# which Cargo copies in as a file.
include = ["/src/**", "/LICENSE", "/README.md"]

# The command is `omni`, shorter to type than the crate's name, which
# `cargo install omni-build` installs it by.
[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
# Pairing for wireless debugging encrypts what the computer and the device
# tell each other with AES-128-GCM, under a key HKDF derives from SPAKE2's.
aes-gcm = "0.10.3"
anyhow = "1.0.104"
base64 = "0.23.1"
# Legacy PKCS #12 keystores, as Keychain Access exports them, encrypt keys
# with 3DES and certificates with 40-bit RC2, in CBC mode.
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
cms = "0.2.3"
const-oid = { version = "0.9.6", features = ["db"] }
crc32fast = "1.5.2"
# The Edwards curve BoringSSL's SPAKE2 works on, which Android pairs
# computers with for wireless debugging. The version that x25519-dalek, for
# the key exchange in rustls-rustcrypto, uses too.
curve25519-dalek = "4.1.3"
des = "0.8.1"
flate2 = "1.1.10"
hkdf = "0.12.4"
hmac = "0.12.1"
# PNG, and WebP for the Android icons Android Studio's templates make, which
# OmniBuild writes losslessly (image-webp, in pure Rust). Resizing icons is
# all OmniBuild does with images.
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "webp",
] }
# actool compresses an asset catalog's bitmaps with LZFSE. Pure Rust, unlike
# the bindings to Apple's C library, so every release target builds without
# a C toolchain. OmniBuild compresses its own pixels with it, and decompresses
# only the images actool packs an icon's smaller sizes into, to paint the
# app's icon into them.
lzfse_rust = "0.2.1"
# Phones plugged in by USB, through each system's own USB API: usbfs on
# Linux, IOKit on macOS and WinUSB on Windows. Pure Rust, unlike libusb's
# bindings, so every release target builds without a C toolchain.
nusb = "0.2.8"
# PKCS #12's structures and key derivation, and PKCS #8's encryption
# (PBES2), of the same RustCrypto generation as cms and x509-cert.
pkcs12 = { version = "0.1.0", features = ["kdf"] }
pkcs8 = { version = "0.10.2", features = ["encryption"] }
# Without serde: Info.plist is edited as a dictionary, so the keys OmniBuild
# doesn't know stay as Xcode wrote them.
plist = { version = "1.10.1", default-features = false }
rc2 = "0.8.1"
# rsa, x509-cert, cms and const-oid are RustCrypto crates of one generation,
# which share der, spki and pkcs8. rsa 0.10 is still a release candidate.
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
# TLS 1.3 for wireless debugging, with a provider of RustCrypto's crates in
# place of rustls' own (aws-lc-rs or ring, which have C and assembly), so
# every release target builds without a C toolchain. TLS 1.3 only, as adbd.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = [
  "std",
  "zeroize",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1 has three uses left: in Apple's code signatures, the resource seal
# for older iOS versions and a non-Apple certificate in a requirement; and
# the signature that proves a computer's key to an Android device over ADB,
# whose PKCS #1 padding names SHA-1 by its OID ("oid").
sha1 = { version = "0.10.7", features = ["oid"] }
sha2 = "0.10.9"
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }

[dev-dependencies]
tempfile = "3.27.0"

# For `cargo binstall omni-build`, which downloads the binary the GitHub
# release has rather than building it: where each target's archive is, and
# where the binary is inside it. packages/release makes the archives, and its
# tests check these templates name them.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/omni-build-{ target }{ archive-suffix }"
bin-dir = "omni-build-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true
