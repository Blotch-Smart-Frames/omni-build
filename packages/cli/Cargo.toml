[package]
name = "omni-build"
description = "Build, sign, install and ship iOS and Android apps with no native toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
# The RustCrypto crates of one generation, which share der, spki and pkcs8.
# rsa 0.10 is still a release candidate.
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
