name: Release

# Publishes the npm packages when a version tag is pushed: `v` and the
# version every package.json and Cargo.toml has, on a commit of master. What
# it publishes is what CI packed for that commit and installed on all six
# OSes and CPUs (the npm-pack and npm-install jobs in ci.yml), so a release
# is never a build CI hasn't passed.
#
# No npm token is stored anywhere. npm trusts this workflow, by its file
# name, and only in the npm environment, to publish each package (trusted
# publishing): it trades GitHub's OIDC token for one that may, and adds
# provenance. The environment asks a maintainer to approve each release
# before the publish job runs. Renaming this file or the environment means
# changing each package's trusted publisher on npm.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time, and none cut off partway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Finds CI's run for the tagged commit, and waits for it if it's still
  # going, before anyone is asked to approve the release.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.run.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All of master, to check the tag is on it.
          fetch-depth: 0
      - name: Check the tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME isn't on master. Tag a commit of master."
            exit 1
          fi
      - name: Wait for CI's run on the tagged commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow ci.yml --event push --branch master --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::CI hasn't run on $GITHUB_SHA as a push to master."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if ! gh run watch "$run" --exit-status --interval 60 > /dev/null; then
            echo "::error::CI failed on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run. Re-run it, then this."
            exit 1
          fi

  publish:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # To download the packages from CI's run.
      actions: read
      # The OIDC token npm trades for one that may publish.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # CI keeps its artifacts for 7 days, so a commit is released within a
      # week of CI running on it, or after running CI on it again.
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages
          run-id: ${{ needs.wait-for-ci.outputs.run }}
          github-token: ${{ github.token }}
      # Node 24's npm is 11.5.1 or later, which trusted publishing needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The release tool uses only Node's built-in modules, so no `npm ci`.
      - run: node packages/release/src/cli.ts publish --packages npm-packages --tag "$GITHUB_REF_NAME"
