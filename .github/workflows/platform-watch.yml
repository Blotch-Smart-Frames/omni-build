name: Platform watch

# Apple and Google raise their store minimums every year: each April, the
# Xcode App Store uploads must be built with, and each August 31, the API
# level Google Play apps must target. Once a day, this compares the toolchain
# the app shells are built with against what the stores require and have
# released, and opens an issue for each update the shells need (see
# packages/platform-watch). A page it can't download or parse gets an issue
# too, so a vendor rewording a page can't quietly stop the watch.

on:
  schedule:
    # Off the hour: GitHub delays scheduled runs, and sometimes drops them,
    # when everyone's start at :00.
    - cron: '23 6 * * *'
  # Also when the shells' toolchain or the watch itself changes on master, so
  # an update closes its issue on merge and a parser fix is tried at once.
  push:
    branches: [master]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/platform-watch.yml
      - packages/shells/webview/android/app/build.gradle.kts
      - packages/platform-watch/src/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two runs at once could both find no issue for a finding and both open one.
concurrency:
  group: platform-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The watch uses only Node's built-in modules, and Node runs its
          # TypeScript by stripping the types, so there's no `npm ci` and
          # nothing to cache. setup-node would otherwise restore npm's cache
          # because of package.json's packageManager field.
          package-manager-cache: false
      # The watch finds its issues by this label. Made here rather than
      # implicitly with the first issue, so it has a description; --force
      # makes it a no-op once it exists.
      - name: Create the label
        run: >-
          gh label create platform-watch --force --color 0E8A16
          --description "Opened by the platform watch: the app shells need a newer Xcode or Android API level"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node packages/platform-watch/src/cli.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
