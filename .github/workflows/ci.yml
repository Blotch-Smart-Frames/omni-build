name: CI

# The pull request gate. Branch protection requires a single check, "CI
# passed", which succeeds only when every job below does, so adding or
# renaming a job never means editing the branch's settings.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes its running checks moot. On master
  # every commit is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The version in rust-toolchain.toml, with its components. Installed in
      # its own step so a slow download doesn't read as a slow task below, and
      # before turbo starts Cargo tasks in parallel, which would race to
      # install it.
      - run: rustup toolchain install
      - run: npm ci
      # oxfmt over the whole repository, then rustfmt per crate.
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore master's cache but don't save their own,
          # which would evict it from the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: npm ci
      # clippy with warnings as errors, and oxlint.
      - run: npm run lint

  # Spelling, in the code and the prose alike: cspell over the files outside
  # packages/, then each package's. A new word goes in the root cspell.json
  # when the whole repository uses it, or in the package's own otherwise.
  cspell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cspell

  # tsc over every TypeScript package. Node, vitest and the docs build all
  # strip the types without checking them, so a type error fails only here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The workflows are code too: a typo in an expression or a matrix key
  # otherwise only shows when that job runs, or silently never does.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # Every test, with the 100% coverage gate: cargo-llvm-cov for Rust and
  # vitest's thresholds for the npm packages both fail below 100% of lines,
  # functions and regions or branches. Then coverage-guard fails it wherever
  # 100% would pass over untested code: a module without a test of its own,
  # one only other modules' tests cover, a coverage-ignore comment, or a file
  # the report leaves out.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The USB tests plug made-up phones into vhci-hcd, Linux's virtual USB
      # host controller (packages/cli/src/adb/usb.rs). The runner's user
      # attaches them, and opens them as Android's udev rules let users
      # open Google's phones.
      - name: Load vhci-hcd for the USB tests
        run: |
          sudo modprobe vhci-hcd
          sudo chmod a+w /sys/devices/platform/vhci_hcd.0/attach
          echo 'SUBSYSTEM=="usb", ATTR{idVendor}=="18d1", MODE="0666"' | sudo tee /etc/udev/rules.d/51-android.rules
          sudo udevadm control --reload-rules
      - run: npm ci
      - run: npm run test:coverage

  # The same tests on the other desktop OSes, which OmniBuild runs on as much
  # as Linux. Linux runs them in the coverage job.
  test:
    strategy:
      # One OS failing shouldn't hide whether the other passes.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: npm ci
      - run: npm test

  # A release build for every target OmniBuild publishes (the list in
  # packages/omni-build/src/platforms.ts), each on a runner of that OS and
  # CPU, so the binary is also run, not just compiled. A target that stops
  # building fails the pull request that broke it rather than the release.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BINARY: target/${{ matrix.target }}/release/omni-build${{ startsWith(matrix.runner, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Linux builds for musl rather than the runner's glibc, so the target
      # isn't installed yet. Elsewhere this is the host target, already there.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the binary
        run: '"$BINARY" --version'
      # The launcher ships one Linux binary per CPU for glibc and musl
      # distributions alike (see platforms.ts), which holds only if it's
      # statically linked.
      - name: Check the binary is statically linked
        if: runner.os == 'Linux'
        run: |
          file "$BINARY"
          file "$BINARY" | grep -Eq 'statically linked|static-pie linked'
      # Kept briefly, to try a pull request's build on a machine without Rust.
      - uses: actions/upload-artifact@v7
        with:
          name: omni-build-${{ matrix.target }}
          path: ${{ env.BINARY }}
          if-no-files-found: error
          retention-days: 7

  # The npm packages a release will publish, packed from the build job's
  # binaries without publishing them (see packages/release): the launcher,
  # and one package per platform holding its binary. Packed once, on Linux,
  # whose file modes npm keeps in the tarballs.
  npm-pack:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w omni-build
      - uses: actions/download-artifact@v8
        with:
          pattern: omni-build-*
          path: binaries
      - run: node packages/release/src/cli.ts pack --binaries binaries --out npm-packages
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-packages
          if-no-files-found: error
          retention-days: 7

  # `npm install omni-build` on each OS and CPU the build job builds for, from
  # a registry on the runner that has the packed packages: npm has to install
  # that machine's binary and no other, and both the command and the API a
  # build tool imports have to run it. Node only: the check uses nothing
  # else, so no `npm ci`.
  npm-install:
    name: npm-install (${{ matrix.runner }})
    needs: npm-pack
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - macos-15-intel
          - ubuntu-24.04-arm
          - ubuntu-latest
          - windows-11-arm
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages
      - run: node packages/release/src/cli.ts check --packages npm-packages

  # End to end, in the three stages OmniBuild is used in (see packages/e2e):
  #
  # 1. e2e-shell-*: the real Swift and Kotlin app shells in
  #    packages/e2e/fixtures, built with Xcode and Gradle. The only stage with
  #    a native toolchain: OmniBuild's own CI makes the shells, never its users.
  # 2. e2e-repackage: each shell through the omni-build binary from the build
  #    job, on Linux, Windows and macOS, with no PATH and none of the
  #    variables that lead to a JDK, the Android SDK or Xcode.
  # 3. e2e-ios, e2e-android: every repackaged app installed and launched on
  #    the iOS Simulator and an Android emulator, each checked against the
  #    values it reports. omni-build installs each Android app, an app
  #    bundle as the APK bundletool makes from it. An iOS build for devices,
  #    which the Simulator can't run, is checked with codesign and by what
  #    its files say.
  #
  # The harness uses only Node's built-in modules, and Node runs its TypeScript
  # by stripping the types, so these jobs skip `npm ci`.
  e2e-shell-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # The Xcode the shells are built with, one of those on the runner image
      # (github.com/actions/runner-images). Pinned rather than the image's
      # default, so a new Xcode, and with it a new SDK in every shell, is a
      # change of its own. The platform watch reads this line to tell when
      # Apple requires or releases a newer one.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Nothing to cache without `npm ci`. setup-node would otherwise
          # restore npm's cache because of package.json's packageManager field.
          package-manager-cache: false
      - run: node packages/e2e/src/cli.ts build --platform ios --out e2e/shells
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-shell-ios
          path: e2e/shells
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-shell-ios
          path: packages/e2e/artifacts
          retention-days: 7

  e2e-shell-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # The JDK the fixture is developed with; AGP 9 needs 17 or later.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's downloads (AGP and its dependencies), saving only on
      # master, and checks that the committed gradle-wrapper.jar is Gradle's.
      - uses: gradle/actions/setup-gradle@v6
      - run: node packages/e2e/src/cli.ts build --platform android --out e2e/shells
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-shell-android
          path: e2e/shells
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-shell-android
          path: packages/e2e/artifacts
          retention-days: 7

  e2e-repackage:
    name: e2e-repackage (${{ matrix.os }})
    needs: [build, e2e-shell-ios, e2e-shell-android]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # The release binary the build job made for this runner.
      OMNI_BUILD_BINARY: ${{ github.workspace }}/omni-build-bin/omni-build${{ matrix.os == 'Windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: omni-build-${{ matrix.target }}
          path: omni-build-bin
      # Workflow artifacts don't keep file modes.
      - name: Make the binary executable
        if: matrix.os != 'Windows'
        run: chmod +x "$OMNI_BUILD_BINARY"
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shell-*
          path: e2e/shells
          merge-multiple: true
      - run: node packages/e2e/src/cli.ts repackage --platform ios --shell e2e/shells/OmniBuildShell.zip --shell e2e/shells/OmniBuildShell.ipa --out e2e/repackaged
      - run: node packages/e2e/src/cli.ts repackage --platform android --shell e2e/shells/OmniBuildShell.apk --shell e2e/shells/OmniBuildShell.aab --out e2e/repackaged
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-repackaged-${{ matrix.os }}
          path: e2e/repackaged
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-repackage-${{ matrix.os }}
          path: packages/e2e/artifacts
          retention-days: 7

  e2e-ios:
    needs: e2e-repackage
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # One app per OS it was repackaged on, named for it.
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-repackaged-*
          path: e2e/repackaged
          merge-multiple: true
      - run: node packages/e2e/src/cli.ts test --platform ios e2e/repackaged/*.zip e2e/repackaged/*.ipa
      # Each app's report and a screenshot, and on a failure its logs.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-ios
          path: packages/e2e/artifacts
          retention-days: 7

  e2e-android:
    needs: [build, e2e-repackage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Android the fixture runs on, 5.0, where an APK installs
        # only with a v1 signature and without `cmd`, and a recent one.
        api-level: [21, 34]
    env:
      # The release binary the build job made for Linux, which installs each
      # app on the emulator, as it would for a user without the Android SDK.
      OMNI_BUILD_BINARY: ${{ github.workspace }}/omni-build-bin/omni-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: omni-build-x86_64-unknown-linux-musl
          path: omni-build-bin
      # Workflow artifacts don't keep file modes.
      - name: Make the binary executable
        run: chmod +x "$OMNI_BUILD_BINARY"
      # For apksigner, and for the app bundles: jarsigner checks their
      # signature, and bundletool makes the APK to install from each, as
      # Google Play does.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-repackaged-*
          path: e2e/repackaged
          merge-multiple: true
      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Emulator images of their own, apart from the API level the shells
      # target: the fixture targets API 37 and runs on 21 and later. A device
      # only applies the behaviour changes of the level an app targets when it
      # runs that level or newer, so this checks the shells install and run,
      # not those changes.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: node packages/e2e/src/cli.ts test --platform android e2e/repackaged/*.apk e2e/repackaged/*.aab
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-android-${{ matrix.api-level }}
          path: packages/e2e/artifacts
          retention-days: 7

  # The documentation site, built as the Docs workflow deploys it. Docusaurus
  # fails the build on a broken link or anchor, so a renamed page or heading
  # fails here rather than on the published site.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @omni-build/docs

  ci-passed:
    name: CI passed
    needs:
      - format
      - lint
      - cspell
      - typecheck
      - actionlint
      - coverage
      - test
      - build
      - npm-pack
      - npm-install
      - e2e-shell-ios
      - e2e-shell-android
      - e2e-repackage
      - e2e-ios
      - e2e-android
      - docs
    # Runs even when a job it needs fails, so the required check reports a
    # failure. Skipped, it would count as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
