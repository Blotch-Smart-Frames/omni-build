name: Shell

# Builds an app shell's variants with Xcode and Gradle, checks that omni
# repackages each one, and leaves them in an artifact with their manifest,
# for a release to publish. A reusable workflow: frameworks call it for
# their shells, and OmniBuild's CI for its own, from ci.yml.
#
#   jobs:
#     shell:
#       uses: Blotch-Smart-Frames/omni-build/.github/workflows/shell.yml@v1.2.3
#       with:
#         name: MyShell
#         xcode-project: ios/MyShell.xcodeproj
#         gradle-project: android
#
# The variants, debug and release: an iOS app for the Simulator (a zipped
# .app) and one for devices (an unsigned .ipa, with room for omni's
# signature), and an Android APK and app bundle. Each is named after the
# shell and its configuration: MyShell-release.apk, MyShell-debug.ipa,
# MyShell-release-simulator.zip. The check repackages each one as an app
# of its own, with omni of this workflow's version, from npm, and writes
# MyShell.json beside them: each one's file, platform, format,
# configuration and SHA-256, which a build tool pins it by. The artifact,
# shell-MyShell, holds the lot. packages/shells/README.md has the rest.
#
# The tools it runs are OmniBuild's own (packages/shells), from the commit
# this workflow is called at, which job.workflow_repository and
# job.workflow_sha name. Everything else is the caller's: its checkout, its
# runners and its permissions.

on:
  workflow_call:
    inputs:
      name:
        description: "The shell's name: its Xcode scheme and the app it builds, and the name of its files. Letters, digits, '.', '_' and '-'."
        required: true
        type: string
      xcode-project:
        description: 'The Xcode project (.xcodeproj), whose scheme `name` builds `name`.app. Without it, no iOS variants.'
        type: string
        default: ''
      gradle-project:
        description: "The Gradle project's folder, with its wrapper and the app in its app module. Without it, no Android variants."
        type: string
        default: ''
      developer-dir:
        description: "The Xcode to build with, as DEVELOPER_DIR takes one: /Applications/Xcode_26.6.app/Contents/Developer. The macOS runner's default without it."
        type: string
        default: ''
      macos-runner:
        description: 'The runner Xcode builds on, for an Xcode only a newer image has.'
        type: string
        default: macos-latest
      java-version:
        description: 'The JDK Gradle runs on, from Temurin.'
        type: string
        default: '21'
      omni-artifact:
        description: "An artifact of this run with omni for Linux x64 in it, to check the variants with rather than npm's. For OmniBuild's own CI, which checks its shells with the omni it has just built."
        type: string
        default: ''
      retention-days:
        description: "How long the artifact is kept. The repository's default without it."
        type: number
        default: 0
    outputs:
      artifact:
        description: 'The artifact with the variants and their manifest.'
        value: shell-${{ inputs.name }}

permissions:
  contents: read

jobs:
  ios:
    if: inputs.xcode-project != ''
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 45
    steps:
      # The caller's repository, with the shell, first: a checkout to the
      # workspace's root empties it.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .omni-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The tools use only Node's built-in modules, so there's no
          # `npm ci` and nothing to cache.
          package-manager-cache: false
      - name: Select Xcode
        if: inputs.developer-dir != ''
        env:
          XCODE: ${{ inputs.developer-dir }}
        run: echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
      - name: Build the shell
        env:
          PROJECT: ${{ inputs.xcode-project }}
          NAME: ${{ inputs.name }}
        run: node .omni-build/packages/shells/src/cli.ts build --platform ios --project "$PROJECT" --name "$NAME" --out "$RUNNER_TEMP/shell"
      # Only for the check job, which takes both platforms' and keeps them.
      - uses: actions/upload-artifact@v7
        with:
          name: shell-${{ inputs.name }}-ios
          path: ${{ runner.temp }}/shell
          if-no-files-found: error
          retention-days: 1

  android:
    if: inputs.gradle-project != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .omni-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      # Caches Gradle's downloads, saving only on the default branch, and
      # checks that the committed gradle-wrapper.jar is Gradle's.
      - uses: gradle/actions/setup-gradle@v6
      # GitHub's Linux runner has the Android SDK, in ANDROID_HOME.
      - name: Build the shell
        env:
          PROJECT: ${{ inputs.gradle-project }}
          NAME: ${{ inputs.name }}
        run: node .omni-build/packages/shells/src/cli.ts build --platform android --project "$PROJECT" --name "$NAME" --out "$RUNNER_TEMP/shell"
      - uses: actions/upload-artifact@v7
        with:
          name: shell-${{ inputs.name }}-android
          path: ${{ runner.temp }}/shell
          if-no-files-found: error
          retention-days: 1

  check:
    needs: [ios, android]
    # After both, when a shell has no project for one, which is skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .omni-build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - if: inputs.omni-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.omni-artifact }}
          path: ${{ runner.temp }}/omni
      - name: Get omni
        id: omni
        env:
          ARTIFACT: ${{ inputs.omni-artifact }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            # Workflow artifacts don't keep file modes.
            chmod +x "$RUNNER_TEMP/omni/omni"
            echo "command=$RUNNER_TEMP/omni/omni" >> "$GITHUB_OUTPUT"
          else
            # The version this workflow is, as every package.json says, so
            # a shell is checked with the omni of the workflow it was
            # built by.
            version=$(node -p "require('./.omni-build/packages/omni-build/package.json').version")
            npm install --prefix "$RUNNER_TEMP/omni" --no-save --no-audit --no-fund "@blotch/omni-build@$version"
            echo "command=$RUNNER_TEMP/omni/node_modules/.bin/omni" >> "$GITHUB_OUTPUT"
          fi
      # By name, as a pattern would take in another shell's too: shell-Web-*
      # matches shell-Web-View-ios.
      - if: needs.ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: shell-${{ inputs.name }}-ios
          path: ${{ runner.temp }}/shell
      - if: needs.android.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: shell-${{ inputs.name }}-android
          path: ${{ runner.temp }}/shell
      - name: Check omni repackages each variant, and write their manifest
        env:
          NAME: ${{ inputs.name }}
          OMNI: ${{ steps.omni.outputs.command }}
        run: node .omni-build/packages/shells/src/cli.ts check --shells "$RUNNER_TEMP/shell" --name "$NAME" --omni "$OMNI"
      - uses: actions/upload-artifact@v7
        with:
          name: shell-${{ inputs.name }}
          path: ${{ runner.temp }}/shell
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
